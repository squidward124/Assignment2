<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <!-- Dark moody background -->
    <rect width="400" height="300" fill="#2C2825"/>

    <!-- Wooden serving board -->
    <ellipse cx="200" cy="170" rx="170" ry="55" fill="#6B3221"/>
    <ellipse cx="200" cy="168" rx="160" ry="48" fill="#8B4520"/>
    <ellipse cx="200" cy="166" rx="155" ry="44" fill="#A8723D"/>
    <!-- Grain lines -->
    <line x1="60" y1="155" x2="340" y2="155" stroke="#7D5025" stroke-width="1" opacity="0.6"/>
    <line x1="60" y1="170" x2="340" y2="170" stroke="#7D5025" stroke-width="1" opacity="0.6"/>
    <line x1="60" y1="180" x2="340" y2="180" stroke="#7D5025" stroke-width="1" opacity="0.6"/>

    <!-- Steak -->
    <path d="M 110 145 Q 130 130 170 132 Q 220 130 260 135 Q 295 145 295 170 Q 290 195 250 200 Q 200 205 150 200 Q 115 195 105 175 Q 100 155 110 145 Z"
          fill="#6B2419"/>
    <path d="M 115 148 Q 135 135 170 137 Q 220 135 258 140 Q 290 150 290 168 Q 285 188 248 193 Q 200 198 152 193 Q 118 188 110 173 Q 105 158 115 148 Z"
          fill="#8B2D1F"/>
    <!-- Char marks -->
    <path d="M 140 145 L 250 145 L 248 152 L 142 152 Z" fill="#2C1410"/>
    <path d="M 145 175 L 245 175 L 243 182 L 147 182 Z" fill="#2C1410"/>
    <!-- Inner pink medium-rare -->
    <ellipse cx="200" cy="167" rx="50" ry="10" fill="#C66B5C" opacity="0.6"/>

    <!-- Salt flakes -->
    <rect x="170" y="160" width="3" height="2" fill="#FFFFFF"/>
    <rect x="200" y="158" width="3" height="2" fill="#FFFFFF"/>
    <rect x="220" y="162" width="3" height="2" fill="#FFFFFF"/>
    <rect x="190" y="170" width="3" height="2" fill="#FFFFFF"/>
    <rect x="240" y="168" width="3" height="2" fill="#FFFFFF"/>

    <!-- Herb sprig (rosemary) -->
    <line x1="200" y1="125" x2="240" y2="135" stroke="#4A7C59" stroke-width="2"/>
    <line x1="205" y1="124" x2="200" y2="118" stroke="#4A7C59" stroke-width="1.5"/>
    <line x1="215" y1="127" x2="212" y2="120" stroke="#4A7C59" stroke-width="1.5"/>
    <line x1="225" y1="131" x2="223" y2="123" stroke="#4A7C59" stroke-width="1.5"/>
    <line x1="235" y1="134" x2="234" y2="127" stroke="#4A7C59" stroke-width="1.5"/>

    <!-- Pat of butter melting -->
    <rect x="155" y="155" width="20" height="12" fill="#F5DC8A"/>
    <ellipse cx="165" cy="170" rx="12" ry="3" fill="#F5DC8A" opacity="0.7"/>

    <!-- Steak knife -->
    <rect x="80" y="240" width="100" height="6" fill="#C0C0C0"/>
    <polygon points="180,240 240,240 240,246 180,246" fill="#C0C0C0"/>
    <polygon points="240,240 250,243 240,246" fill="#A0A0A0"/>
    <rect x="60" y="237" width="22" height="12" rx="2" fill="#6B3221"/>
    <rect x="60" y="240" width="22" height="6" fill="#8B4520"/>

    <!-- Wine glass shadow -->
    <ellipse cx="340" cy="80" rx="30" ry="6" fill="#000000" opacity="0.5"/>
    <!-- Wine glass -->
    <path d="M 320 25 Q 320 60 340 65 Q 360 60 360 25 Z" fill="#7C2E1A" opacity="0.8"/>
    <path d="M 322 30 Q 322 55 340 60 Q 358 55 358 30 Z" fill="#A8492E"/>
    <rect x="338" y="65" width="4" height="20" fill="#FAF3E7" opacity="0.3"/>
    <ellipse cx="340" cy="86" rx="14" ry="3" fill="#FAF3E7" opacity="0.3"/>
</svg>
