<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <!-- Light Mediterranean background -->
    <rect width="400" height="300" fill="#F5EBD8"/>
    <!-- Tiled table surface -->
    <rect y="220" width="400" height="80" fill="#FAF3E7"/>
    <line x1="80" y1="220" x2="80" y2="300" stroke="#E8DCC4" stroke-width="1"/>
    <line x1="160" y1="220" x2="160" y2="300" stroke="#E8DCC4" stroke-width="1"/>
    <line x1="240" y1="220" x2="240" y2="300" stroke="#E8DCC4" stroke-width="1"/>
    <line x1="320" y1="220" x2="320" y2="300" stroke="#E8DCC4" stroke-width="1"/>
    <line x1="0" y1="260" x2="400" y2="260" stroke="#E8DCC4" stroke-width="1"/>

    <!-- Large round mezze platter -->
    <circle cx="200" cy="160" r="120" fill="#FFFFFF"/>
    <circle cx="200" cy="160" r="110" fill="#FAF3E7"/>
    <circle cx="200" cy="160" r="105" fill="#FFFFFF"/>
    <circle cx="200" cy="160" r="100" fill="none" stroke="#D4A24C" stroke-width="2"/>

    <!-- Hummus dip in centre -->
    <circle cx="200" cy="160" r="30" fill="#E8B870"/>
    <circle cx="200" cy="158" r="26" fill="#F2C98A"/>
    <!-- Olive oil drizzle on hummus -->
    <circle cx="195" cy="155" r="2.5" fill="#7C2E1A"/>
    <circle cx="208" cy="160" r="3" fill="#A8492E"/>
    <circle cx="200" cy="167" r="2" fill="#6B3221"/>
    <!-- Paprika sprinkle -->
    <circle cx="190" cy="160" r="1.5" fill="#C65D3F"/>
    <circle cx="215" cy="155" r="1.5" fill="#C65D3F"/>
    <circle cx="205" cy="170" r="1.5" fill="#C65D3F"/>

    <!-- Olives section (left) -->
    <ellipse cx="125" cy="140" rx="8" ry="11" fill="#3D2F1F"/>
    <ellipse cx="140" cy="148" rx="8" ry="11" fill="#4A7C59"/>
    <ellipse cx="125" cy="160" rx="8" ry="11" fill="#3D2F1F"/>
    <ellipse cx="142" cy="170" rx="8" ry="11" fill="#4A7C59"/>
    <ellipse cx="125" cy="180" rx="8" ry="11" fill="#3D2F1F"/>
    <ellipse cx="135" cy="125" rx="8" ry="11" fill="#4A7C59"/>

    <!-- Pita bread triangles (right) -->
    <polygon points="260,130 285,125 280,155 255,150" fill="#E8B870"/>
    <polygon points="263,133 282,129 278,151 257,147" fill="#F2C98A"/>
    <polygon points="270,165 295,160 290,190 265,185" fill="#E8B870"/>
    <polygon points="273,168 292,164 288,186 267,182" fill="#F2C98A"/>

    <!-- Cherry tomatoes (bottom) -->
    <circle cx="170" cy="210" r="9" fill="#C65D3F"/>
    <circle cx="168" cy="207" r="2" fill="#E48560"/>
    <circle cx="195" cy="218" r="9" fill="#C65D3F"/>
    <circle cx="193" cy="215" r="2" fill="#E48560"/>
    <circle cx="220" cy="213" r="9" fill="#C65D3F"/>
    <circle cx="218" cy="210" r="2" fill="#E48560"/>

    <!-- Feta cheese cubes (top) -->
    <rect x="195" y="80" width="14" height="14" fill="#FFFFFF" stroke="#E8DCC4" stroke-width="1"/>
    <rect x="180" y="95" width="13" height="13" fill="#FFFFFF" stroke="#E8DCC4" stroke-width="1"/>
    <rect x="210" y="92" width="14" height="14" fill="#FFFFFF" stroke="#E8DCC4" stroke-width="1"/>

    <!-- Mint leaves scattered -->
    <ellipse cx="155" cy="105" rx="7" ry="3" fill="#4A7C59" transform="rotate(-20 155 105)"/>
    <ellipse cx="250" cy="105" rx="7" ry="3" fill="#4A7C59" transform="rotate(20 250 105)"/>
    <ellipse cx="245" cy="200" rx="6" ry="3" fill="#7BA876" transform="rotate(-30 245 200)"/>

    <!-- Lemon wedge -->
    <path d="M 105 215 L 135 200 L 138 220 L 110 230 Z" fill="#F5C967"/>
    <path d="M 108 217 L 132 204 L 135 218 L 113 226 Z" fill="#F5DC8A"/>

    <!-- Olive oil bottle in corner -->
    <rect x="40" y="60" width="22" height="50" fill="#4A7C59"/>
    <rect x="44" y="50" width="14" height="14" fill="#4A7C59"/>
    <rect x="42" y="65" width="18" height="5" fill="#FAF3E7"/>
    <rect x="44" y="80" width="14" height="20" fill="#D4A24C" opacity="0.6"/>
</svg>
