<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <!-- Soft background -->
    <rect width="400" height="300" fill="#E8DCC4"/>
    <!-- Wooden surface -->
    <rect y="200" width="400" height="100" fill="#A8723D"/>
    <line x1="0" y1="220" x2="400" y2="220" stroke="#7D5025" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="400" y2="250" stroke="#7D5025" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="400" y2="280" stroke="#7D5025" stroke-width="0.5"/>

    <!-- Bowl (cream coloured) -->
    <ellipse cx="200" cy="200" rx="130" ry="35" fill="#FFFFFF"/>
    <ellipse cx="200" cy="198" rx="118" ry="28" fill="#FAF3E7"/>
    <ellipse cx="200" cy="195" rx="110" ry="24" fill="#F5EBD8"/>

    <!-- Grains base -->
    <ellipse cx="200" cy="195" rx="100" ry="20" fill="#E8B870"/>
    <circle cx="170" cy="192" r="2" fill="#D4A24C"/>
    <circle cx="200" cy="194" r="2" fill="#D4A24C"/>
    <circle cx="230" cy="190" r="2" fill="#D4A24C"/>
    <circle cx="190" cy="198" r="1.5" fill="#A8723D"/>
    <circle cx="220" cy="196" r="1.5" fill="#A8723D"/>

    <!-- Avocado wedges -->
    <ellipse cx="135" cy="190" rx="22" ry="14" fill="#4A7C59"/>
    <ellipse cx="135" cy="189" rx="18" ry="10" fill="#7BA876"/>
    <ellipse cx="135" cy="188" rx="14" ry="7" fill="#A6C49C"/>

    <!-- Cherry tomatoes -->
    <circle cx="240" cy="185" r="11" fill="#C65D3F"/>
    <circle cx="237" cy="182" r="3" fill="#E48560"/>
    <circle cx="260" cy="192" r="10" fill="#C65D3F"/>
    <circle cx="257" cy="190" r="3" fill="#E48560"/>

    <!-- Beetroot cubes -->
    <rect x="170" y="180" width="14" height="14" fill="#7C2E5B" transform="rotate(15 177 187)"/>
    <rect x="155" y="183" width="12" height="12" fill="#7C2E5B" transform="rotate(-10 161 189)"/>
    <rect x="185" y="184" width="11" height="11" fill="#9C3F73" transform="rotate(20 190 189)"/>

    <!-- Microgreens / herbs on top -->
    <path d="M 200 178 Q 205 168 210 172 Q 215 165 220 172"
          fill="#4A7C59" stroke="#3D6248" stroke-width="0.5"/>
    <path d="M 175 178 Q 180 168 185 175"
          fill="#4A7C59" stroke="#3D6248" stroke-width="0.5"/>
    <ellipse cx="205" cy="180" rx="4" ry="2" fill="#7BA876"/>
    <ellipse cx="215" cy="184" rx="4" ry="2" fill="#7BA876"/>
    <ellipse cx="190" cy="180" rx="3" ry="1.5" fill="#7BA876"/>

    <!-- Sesame seeds -->
    <ellipse cx="180" cy="195" rx="1.5" ry="1" fill="#FAF3E7"/>
    <ellipse cx="210" cy="194" rx="1.5" ry="1" fill="#FAF3E7"/>
    <ellipse cx="225" cy="197" rx="1.5" ry="1" fill="#FAF3E7"/>
    <ellipse cx="195" cy="200" rx="1.5" ry="1" fill="#FAF3E7"/>

    <!-- Lemon slice -->
    <circle cx="280" cy="190" r="14" fill="#F5C967"/>
    <circle cx="280" cy="190" r="12" fill="#F5DC8A"/>
    <line x1="268" y1="190" x2="292" y2="190" stroke="#E8B870" stroke-width="1"/>
    <line x1="280" y1="178" x2="280" y2="202" stroke="#E8B870" stroke-width="1"/>
    <line x1="271" y1="181" x2="289" y2="199" stroke="#E8B870" stroke-width="1"/>
    <line x1="289" y1="181" x2="271" y2="199" stroke="#E8B870" stroke-width="1"/>

    <!-- Leafy branch decoration -->
    <path d="M 50 90 Q 100 70 150 80" stroke="#4A7C59" stroke-width="2" fill="none"/>
    <ellipse cx="70" cy="83" rx="9" ry="4" fill="#4A7C59" transform="rotate(-15 70 83)"/>
    <ellipse cx="90" cy="78" rx="9" ry="4" fill="#7BA876" transform="rotate(-5 90 78)"/>
    <ellipse cx="115" cy="77" rx="9" ry="4" fill="#4A7C59" transform="rotate(10 115 77)"/>
    <ellipse cx="135" cy="80" rx="9" ry="4" fill="#7BA876" transform="rotate(20 135 80)"/>
</svg>
